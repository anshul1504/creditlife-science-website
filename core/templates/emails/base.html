<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#f6f3ec;font-family:Poppins,Arial,Helvetica,sans-serif;color:#3a4657;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f3ec;">
<tr><td align="center" style="padding:24px 12px;">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border:1px solid #e7e2d6;border-radius:14px;overflow:hidden;">
    <tr><td style="background:#0b2239;padding:22px 32px;">
      <div style="font-size:20px;font-weight:600;color:#ffffff;letter-spacing:-0.01em;">Credit Lifesciences</div>
      <div style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#8fe0bd;margin-top:2px;">{{ SITE.tagline }}</div>
    </td></tr>
    <tr><td style="padding:32px;font-size:15px;line-height:1.7;color:#3a4657;">
      {% block body %}{% endblock %}
    </td></tr>
    <tr><td style="background:#f6f3ec;padding:20px 32px;font-size:12px;line-height:1.6;color:#667385;border-top:1px solid #e7e2d6;">
      Need help? Call {{ SITE.phones.0.0 }} or write to <a href="mailto:{{ SITE.email }}" style="color:#0e7a55;">{{ SITE.email }}</a>.<br>
      Credit Lifesciences. Product information is for general awareness and is not a substitute for medical advice.
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
