{% extends "emails/base.html" %}
{% block body %}
<h1 style="margin:0 0 12px;font-size:22px;color:#101c2b;">We answered your question</h1>
<p style="margin:0 0 6px;color:#667385;">You asked about {{ q.product.name }}:</p>
<p style="margin:0 0 16px;"><b style="color:#101c2b;">{{ q.question }}</b></p>
<p style="margin:0 0 16px;padding:14px 18px;background:#e6f2ec;border-radius:10px;color:#0a5e42;">{{ q.answer|linebreaksbr }}</p>
<p style="margin:24px 0;"><a href="{{ product_url }}" style="background:#0e7a55;color:#ffffff;text-decoration:none;font-weight:500;padding:13px 28px;border-radius:10px;display:inline-block;">View on the website</a></p>
{% endblock %}
