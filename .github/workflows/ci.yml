name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyflakes
      - name: Lint (undefined names and unused imports)
        run: python -m pyflakes core config
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          DJANGO_DEBUG=0 python manage.py check --deploy --fail-level ERROR
      - name: Production static files build
        run: DJANGO_DEBUG=0 python manage.py collectstatic --noinput
      - name: Tests
        run: python manage.py test core
